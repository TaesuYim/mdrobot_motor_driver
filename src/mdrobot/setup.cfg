[tool:pytest]
testpaths = test
# test/ has no __init__.py, so pytest puts only the test directory on sys.path.
# Naming the package root (this directory) is what makes `import mdrobot` work.
# This file is the config pytest picks when a path is passed explicitly, e.g.
# `pytest src/mdrobot/test` from the repository root.
pythonpath = .
